# Temporary smoke-test Blueprint for Render's Free web-service plan.
#
# This is intentionally separate from render-paid.yaml. Free services cannot use
# persistent disks, so do not upload documents that must survive a restart or
# redeploy. Use render-paid.yaml for the real disk-backed deployment.
services:
  - type: web
    name: sealguard-free-test
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: bash build.sh
    startCommand: bash start-render.sh
    healthCheckPath: /health/
    autoDeployTrigger: off
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATA_ROOT
        value: /opt/render/project/src/data
      - key: SERVE_MEDIA
        value: "True"
      - key: RSA_PRIVATE_KEY_PATH
        value: /etc/secrets/private.pem
      - key: RSA_PUBLIC_KEY_PATH
        value: /etc/secrets/public.pem
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      # Temporary Free-tier test account. Add the values in Render's
      # Environment page; never commit the password to this repository.
      - key: SEALGUARD_BOOTSTRAP_USERNAME
        sync: false
      - key: SEALGUARD_BOOTSTRAP_PASSWORD
        sync: false
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "3600"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: SECURE_HSTS_PRELOAD
        value: "True"
      # Free Render services cannot send SMTP traffic. The console backend
      # records the message in the app's outgoing-email log and writes it to
      # the service log, which is sufficient for this temporary test service.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: DEFAULT_FROM_EMAIL
        value: test@example.com
      # Optional authenticated n8n email delivery; configure the URL and secret
      # in Render, and keep the secret out of source control.
      - key: N8N_EMAIL_WEBHOOK_URL
        sync: false
      - key: N8N_EMAIL_WEBHOOK_HEADER
        value: X-SealGuard-Webhook
      - key: N8N_EMAIL_WEBHOOK_SECRET
        sync: false
      - key: N8N_EMAIL_WEBHOOK_TIMEOUT
        value: "10"
