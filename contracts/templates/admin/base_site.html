{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | SealGuard Admin{% endblock %}

{% block extrastyle %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'contracts/sealguard-admin.css' %}">
{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}" class="sealguard-admin-brand">
        <span class="sealguard-admin-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <path d="m9 12 2 2 4-4"/>
            </svg>
        </span>
        <span>
            <strong>SealGuard</strong>
            <small>Administration Portal</small>
        </span>
    </a>
</div>
{% endblock %}

{% block nav-global %}
<a class="sealguard-back-link" href="{% url 'contract_list' %}">Back to SealGuard</a>
{% endblock %}
